# SPDX-License-Identifier: MPL-2.0
name: localhold_vault_native
description: Typed production Flutter-to-native vault security boundary for Localhold.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: 1.18.3
  localhold_vault_core:
    path: ../vault_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 28.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.localhold.localhold_key_bridge
        pluginClass: LocalholdKeyBridgePlugin
      ios:
        pluginClass: LocalholdKeyBridgePlugin
