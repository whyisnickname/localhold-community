# SPDX-License-Identifier: MPL-2.0
name: localhold_key_bridge
description: Typed Flutter-to-native key boundary spike for Localhold.
version: 0.0.0-spike.1
publish_to: none

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: 1.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 28.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.localhold.localhold_key_bridge
        pluginClass: LocalholdKeyBridgePlugin
      ios:
        pluginClass: LocalholdKeyBridgePlugin
